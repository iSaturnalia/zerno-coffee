<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЗЕРНО — 3D-модели</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Unbounded:wght@800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #e9e8e6; --ink: #141210; --muted: #6b6560; --accent: #bf511b; --chip: rgba(255,255,255,.7); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: Manrope, system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  header { position: fixed; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; pointer-events: none; }
  h1 { font-family: Unbounded, sans-serif; font-size: 20px; letter-spacing: .02em; }
  .hint { color: var(--muted); font-size: 13px; }
  .panel { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: grid; gap: 12px; justify-items: center; width: min(100% - 32px, 760px); }
  .tabs { display: flex; max-width: 100%; overflow-x: auto; scrollbar-width: none; gap: 4px; padding: 6px; border-radius: 99px; background: var(--chip); backdrop-filter: blur(10px); box-shadow: 0 0 0 1px rgba(20,18,16,.08), 0 10px 30px -12px rgba(20,18,16,.3); }
  .tabs button { font: 700 13px Manrope, sans-serif; border: 0; border-radius: 99px; padding: 10px 14px; white-space: nowrap; background: transparent; color: var(--ink); cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sliders { display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: center; padding: 12px 20px; border-radius: 16px; background: var(--chip); backdrop-filter: blur(10px); font-size: 13px; font-weight: 700; }
  .sliders[hidden] { display: none; }
  .sliders label { display: flex; align-items: center; gap: 10px; }
  input[type=range] { width: 180px; accent-color: var(--accent); }
  @media (max-width: 560px) {
    .hint { display: none; }
    input[type=range] { width: 130px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <h1>◆ ЗЕРНО · 3D</h1>
  <span class="hint">Тяни мышью, чтобы вращать · колесо — приблизить</span>
</header>
<div class="panel">
  <div class="sliders" id="grinderControls">
    <label>Зёрна <input type="range" id="fill" min="0" max="1" step="0.01" value="1"></label>
    <label>Разбор <input type="range" id="explode" min="0" max="1" step="0.01" value="0"></label>
  </div>
  <nav class="tabs" id="tabs" aria-label="Модели">
    <button data-model="grinder" aria-pressed="true">Кофемолка</button>
    <button data-model="kettle">Чайник</button>
    <button data-model="pourover">Пуровер</button>
    <button data-model="cup">Чашка</button>
    <button data-model="beans">Зёрна</button>
    <button data-model="drop">Капля</button>
  </nav>
</div>
<script type="module" src="js/viewer.js?v=10"></script>
</body>
</html>
